<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Control</title>
    <script>
      // Before the stylesheet and the app load: a dark choice paints the night
      // ground at once instead of flashing white. lib/appearance.ts then
      // applies the whole palette.
      (function () {
        try {
          var a = localStorage.getItem("nova.appearance");
          if (a === "dark" || (a !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
            var s = document.documentElement.style;
            s.backgroundColor = "#0A1220";
            s.colorScheme = "dark";
            s.setProperty("--ground", "#0A1220");
            s.setProperty("--card", "#131B2B");
            s.setProperty("--ink", "#FFFFFF");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
